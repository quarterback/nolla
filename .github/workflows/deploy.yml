# Deploys the Worker to Cloudflare on every push to main.
# Needs two repository secrets: CLOUDFLARE_API_TOKEN (a token with Workers
# Scripts: Edit and Zone: Read on the zones) and CLOUDFLARE_ACCOUNT_ID.
# A third, MODAL_TOKEN, connects the model: when it is set, the deploy copies
# it into the Worker, which takes the endpoint URL from wrangler.toml, and the
# desk stops answering from the script.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --legacy-peer-deps
      - run: npm run check
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
      - name: Connect the model
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          MODAL_TOKEN: ${{ secrets.MODAL_TOKEN }}
        run: |
          if [ -n "$MODAL_TOKEN" ]; then
            printf '%s' "$MODAL_TOKEN" | npx wrangler secret put MODAL_TOKEN
            echo "model connected"
          else
            echo "no model token; the desk answers from the script"
          fi
