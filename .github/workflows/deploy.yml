# Deploys the Worker to Cloudflare on every push to main.
# Needs two repository secrets: CLOUDFLARE_API_TOKEN (a token with Workers
# Scripts: Edit and Zone: Read on the zones) and CLOUDFLARE_ACCOUNT_ID.
# Two more, MODAL_BASE_URL and MODAL_TOKEN, connect the model: when they are
# set, the deploy copies them into the Worker and the desk stops answering
# from the script.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --legacy-peer-deps
      - run: npm run check
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
      - name: Connect the model
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          MODAL_BASE_URL: ${{ secrets.MODAL_BASE_URL }}
          MODAL_TOKEN: ${{ secrets.MODAL_TOKEN }}
        run: |
          if [ -n "$MODAL_BASE_URL" ] && [ -n "$MODAL_TOKEN" ]; then
            printf '%s' "$MODAL_BASE_URL" | npx wrangler secret put MODAL_BASE_URL
            printf '%s' "$MODAL_TOKEN" | npx wrangler secret put MODAL_TOKEN
            echo "model connected"
          else
            echo "no model secrets; the desk answers from the script"
          fi
