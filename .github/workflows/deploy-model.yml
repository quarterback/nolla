# Deploys the model to Modal and connects the Worker to it, from GitHub.
# Run it by hand from the Actions tab. Needs five repository secrets:
#   MODAL_TOKEN_ID, MODAL_TOKEN_SECRET   from Modal, Settings, API tokens
#   MODAL_TOKEN                          any long random string; the Worker
#                                        sends it and the model checks it
#   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID   as for the site deploy
# The run also stores the endpoint URL as the MODAL_BASE_URL repository
# variable, so later site deploys keep the connection.
name: Deploy model

on:
  workflow_dispatch:

jobs:
  model:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pip install modal
      - name: Deploy to Modal
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          MODAL_TOKEN: ${{ secrets.MODAL_TOKEN }}
        run: |
          modal secret create nolla-model PROXY_TOKEN="$MODAL_TOKEN" --force
          modal deploy modal/serve.py 2>&1 | tee deploy.log
          url=$(grep -oE 'https://[a-z0-9.-]+\.modal\.run' deploy.log | head -1)
          test -n "$url" || { echo "no endpoint URL in the deploy output"; exit 1; }
          echo "MODAL_BASE_URL=$url" >> "$GITHUB_ENV"
          echo "endpoint: $url"
      - name: Connect the Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          MODAL_TOKEN: ${{ secrets.MODAL_TOKEN }}
        run: |
          npm install --legacy-peer-deps
          printf '%s' "$MODAL_BASE_URL" | npx wrangler secret put MODAL_BASE_URL
          printf '%s' "$MODAL_TOKEN" | npx wrangler secret put MODAL_TOKEN
          echo "the desk now answers from the model at $MODAL_BASE_URL"
      - name: Wake the model
        env:
          MODAL_TOKEN: ${{ secrets.MODAL_TOKEN }}
        run: |
          curl -s -o /dev/null -w "model: %{http_code}\n" -m 600 -H "authorization: Bearer $MODAL_TOKEN" "$MODAL_BASE_URL/v1/models" || true
