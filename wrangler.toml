name = "nolla"
main = "src/worker/index.ts"
compatibility_date = "2026-08-15"
compatibility_flags = ["nodejs_compat"]

# Access covers the custom domain. The workers.dev address stays off so there
# is no way around it.
workers_dev = false
routes = [
  { pattern = "0000th.ai", custom_domain = true },
  # The old placeholder domain. The Worker sends it to 0000th.ai.
  { pattern = "nollanolla.com", custom_domain = true },
  # www.nollanolla.com joins once its old DNS record is deleted.
]

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
# The Worker sees every request, so the redirect from nollanolla.com runs
# before the static page is served.
run_worker_first = true

[vars]
# "1" skips the Access check and, when no model is set, answers from the
# scenario's script. Never set it in production.
DEV_MODE = "0"
# "1" answers from the script until the model is deployed. Access still applies.
SCRIPTED = "1"
# Cloudflare Access: the team domain (without https://) and the application
# audience tag from the Access application for 0000th.ai.
ACCESS_TEAM_DOMAIN = "autumn-tooth-671a.cloudflareaccess.com"
ACCESS_AUD = "376283b085d1a62b190a8e0c348d801d7473f4d902ed5d51689f6fb04cf061bd"
# The model name vLLM serves. Must match modal/serve.py.
MODEL_NAME = "Qwen/Qwen2.5-7B-Instruct"

# Secrets, set with `wrangler secret put`:
#   MODAL_BASE_URL   the Modal web endpoint, for example https://you--nolla-model-serve.modal.run
#   MODAL_TOKEN      the same value as the PROXY_TOKEN Modal secret
